name: Docs

# Builds the documentation site from `docs/` and publishes it to GitHub Pages at
# https://hw-native-sys.github.io/pypto-serving/.
#
# Pull requests build only -- `mkdocs build --strict` turns broken links, pages
# missing from the nav, and every other warning into a failure, so a PR that
# breaks a cross-reference is caught before it reaches main.
#
# Publishing goes through actions/deploy-pages. The `github-pages` environment
# restricts deployments to `main`, which is why the deploy job below is gated on
# that ref.
#
# The site is a build artifact and is never committed; the markdown under `docs/`
# stays the single source of truth.

on:
  push:
    branches: [ "main" ]
  pull_request:
  # Republish without a code change, and exercise the deploy path on demand.
  workflow_dispatch:

# Allow one deploy at a time; skip superseded runs rather than queueing them.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt

      # Fast, MkDocs-independent checks: no page missing from the nav, no nav entry
      # pointing at a deleted file, no public doc referencing internal skills paths.
      - name: Check nav coverage
        run: python tests/lint/check_docs_nav.py

      - name: Check public docs boundaries
        run: python tests/lint/check_public_docs.py

      - name: Build site
        env:
          # Ref that docs/_hooks/repo_links.py points repo links at. On a pull
          # request the new files do not exist on main yet, so link at the commit.
          DOCS_REF: ${{ github.event_name == 'push' && 'main' || github.sha }}
        # --strict fails on a dead intra-docs link, a page missing from nav, or a
        # bad anchor.
        run: mkdocs build --strict

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only main publishes; a pull request builds to prove the docs still compile.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4